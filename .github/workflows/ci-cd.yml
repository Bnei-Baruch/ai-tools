name: CI/CD

# CI: every push and pull request is type-checked and built.
# CD: only a manual run (Actions -> CI/CD -> Run workflow, any branch) deploys
# that build to https://ai-tools.kab.info/.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn typecheck

      # Vite reads REACT_APP_* from the environment; values live in the repo's Actions variables.
      # Keycloak settings fall back to the defaults in src/consts.js when unset.
      - run: yarn build
        env:
          REACT_APP_KEYCLOAK_URL: ${{ vars.REACT_APP_KEYCLOAK_URL }}
          REACT_APP_KEYCLOAK_REALM: ${{ vars.REACT_APP_KEYCLOAK_REALM }}
          REACT_APP_KEYCLOAK_CLIENT_ID: ${{ vars.REACT_APP_KEYCLOAK_CLIENT_ID }}
          REACT_APP_AI_TRNS_API: ${{ vars.REACT_APP_AI_TRNS_API }}
          REACT_APP_STT_MODEL: ${{ vars.REACT_APP_STT_MODEL }}
          REACT_APP_ALIGN_URL: ${{ vars.REACT_APP_ALIGN_URL }}
          REACT_APP_REVIEW_API: ${{ vars.REACT_APP_REVIEW_API }}
          REACT_APP_LIVE_STREAM_URL: ${{ vars.REACT_APP_LIVE_STREAM_URL }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ vars.REACT_APP_GOOGLE_CLIENT_ID }}
          REACT_APP_GOOGLE_API_KEY: ${{ vars.REACT_APP_GOOGLE_API_KEY }}
          REACT_APP_GOOGLE_ACCOUNT: ${{ vars.REACT_APP_GOOGLE_ACCOUNT }}

      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build/

      # the host and its keys (ssh-keyscan lines) are the repo's secrets DEPLOY_HOST, DEPLOY_KNOWN_HOSTS
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: rsync -av -e "ssh -i ~/.ssh/id_deploy" build/ "root@$DEPLOY_HOST:/usr/share/angie/html/ai-tools/"
